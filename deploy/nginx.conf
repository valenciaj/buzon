# /etc/nginx/sites-available/buzon
# Certificados: sudo certbot --nginx -d correo.ejemplo.es

server {
    listen 80;
    listen [::]:80;
    server_name correo.ejemplo.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name correo.ejemplo.es;

    ssl_certificate     /etc/letsencrypt/live/correo.ejemplo.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/correo.ejemplo.es/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Adjuntos de hasta 50 MB.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket para los avisos en tiempo real.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
