<style>
/* Layout: app de tres paneles (bandejas | lista | lector) que se pliega a uno en móvil, con barra inferior al alcance del pulgar */
:root {

.items { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 1rem; }

.tag { font-size: 0.72rem; border-radius: 4px; padding: 0.05rem 0.4rem; background: var(--surface-2); color: var(--muted); font-weight: 600; }

.feed { padding: 0.75rem var(--pad); display: flex; flex-direction: column; gap: 0.75rem; }

.receipt:hover { background: var(--surface-2); }
.receipt .amt { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.receipt .sub { color: var(--muted); font-size: 0.85rem; }

.screen { padding: var(--row) var(--pad); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.6rem; }
.screen .top { display: flex; gap: 0.75rem; align-items: center; min-width: 0; }
.screen .top > div { min-width: 0; }
.screen .addr { font-size: 0.85rem; color: var(--muted); overflow-wrap: anywhere; }

.empty { padding: 3rem var(--pad); text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 1.05rem; margin-bottom: 0.25rem; }

.reader { min-width: 0; min-height: 0; overflow-y: auto; background: var(--bg); }
.reader-inner { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; display: flex; flex-direction: column; gap: 1rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 0.4rem; position: sticky; top: 0; background: var(--bg); padding: 0.75rem 0; z-index: 2; border-bottom: 1px solid var(--line); }

.from .addr { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }

.tabbar { display: none; }
.menu-btn { display: none; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, #000 40%, transparent); display: grid; place-items: center; z-index: 20; padding: 1rem; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; width: min(40rem, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; }

.seg { display: flex; flex-wrap: wrap; gap: 0.35rem; }

.seg button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight: 600; }
.swatches { display: flex; gap: 0.5rem; flex-wrap: wrap; }

.range input { flex: 1; accent-color: var(--accent); }
.range output { font-variant-numeric: tabular-nums; min-width: 3.5rem; text-align: right; font-weight: 600; }
.preview { border: 1px solid var(--line); border-radius: 8px; padding: 0.75rem 0.9rem; background: var(--bg); }
.sheet-foot { display: flex; gap: 0.5rem; justify-content: flex-end; padding: 0.9rem 1.1rem; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 0.6rem 1rem; border-radius: 8px; font-size: 0.9rem; z-index: 30; max-width: calc(100% - 2rem); }
.proto { font-size: 0.75rem; color: var(--muted); padding: 0 0.5rem; }

@media (max-width: 1024px) {

  .side { position: fixed; inset: 0 auto 0 0; width: min(18rem, 85vw); z-index: 15; transform: translateX(-100%); transition: transform 0.15s ease; padding-top: calc(1rem + env(safe-area-inset-top, 0px)); padding-left: max(0.75rem, env(safe-area-inset-left, 0px)); }
  .app[data-drawer="open"] .side { transform: none; box-shadow: 0 0 0 100vmax color-mix(in srgb, #000 35%, transparent); }

  .toast { bottom: calc(4.5rem + env(safe-area-inset-bottom, 0px)); }
}

function msgsFor(box) {
  let r = MSGS.filter(inScope);
  if (box === 'entrada') r = r.filter(m => m.box !== 'enviados' && m.box !== 'archivo');
  else if (box === 'later') r = r.filter(m => m.later);
  else if (box === 'aside') r = r.filter(m => m.aside);
  else r = r.filter(m => m.box === box);
  if (S.q) { const q = S.q.toLowerCase(); r = r.filter(m => (m.from + ' ' + m.subject + ' ' + m.snip).toLowerCase().includes(q)); }
  return r;
}
function count(box) {
  const r = msgsFor(box);
  if (box === 'later' || box === 'aside' || box === 'screener') return r.length;
  return r.filter(m => m.unread).length;
}

function applyLook() {
  const root = document.documentElement;
  if (S.theme === 'claro') root.dataset.theme = 'light';

  const a = ACCENTS[S.accent] || ACCENTS[0];
  root.style.setProperty('--accent-l', a[1]);
  root.style.setProperty('--accent-d', a[2]);
  root.style.setProperty('--font', (FONTS[S.font] || FONTS[0])[1]);

}

    ? [['principal', 'Principal', I.home], ['novedades', 'Novedades', I.feed], ['recibos', 'Recibos', I.receipt], ['screener', 'Aprobar', I.screen]]
    : [['entrada', 'Entrada', I.inbox], ['enviados', 'Enviados', I.sent], ['archivo', 'Archivo', I.archive]];
  $('tabbar').innerHTML = tabs.map(([k, n, ic]) => { const c = k === 'screener' || k === 'principal' || k === 'entrada' ? count(k) : 0; return `<button data-box="${k}" aria-current="${S.box === k}">${ic}<span>${n}</span>${c ? `<span class="badge">${c}</span>` : ''}</button>`; }).join('') + `<button data-act="drawer">${I.more}<span>Más</span></button>`;
}

function render() { applyLook(); renderSide(); renderList(); renderReader(); renderTabbar(); }

let toastT;
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2600); }

function seg(name, opts, cur) { return `<div class="seg" role="group">${opts.map(([v, l]) => `<button data-set="${name}" data-val="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`; }

function openSettings() {
  $('layer').innerHTML = `<div class="overlay" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="st-title">
    <div class="sheet-head"><h2 id="st-title">Ajustes</h2><button class="btn ghost small" data-act="close" aria-label="Cerrar">${I.x}</button></div>
    <div class="sheet-body">
      <div class="field"><span>Modo de trabajo</span>${seg('mode', [['enfoque', 'Enfoque'], ['clasico', 'Clásico']], S.mode)}<small>Enfoque filtra remitentes nuevos y separa Principal, Novedades y Recibos. Clásico muestra las carpetas de siempre. Cambiar no borra nada.</small></div>
      <div class="field"><span>Vista de cuentas</span>${seg('view', [['unificada', 'Unificada'], ['cuenta', 'Por cuenta']], S.view)}<small>Unificada junta todas las cuentas, con un color por cuenta.</small></div>
      <div class="field"><span>Tema</span>${seg('theme', [['sistema', 'Como el sistema'], ['claro', 'Claro'], ['oscuro', 'Oscuro']], S.theme)}</div>
      <div class="field"><span>Color de acento</span><div class="swatches">${ACCENTS.map((a, i) => `<button class="swatch" style="background:${a[1]}" data-set="accent" data-val="${i}" aria-pressed="${S.accent === i}" aria-label="${a[0]}" title="${a[0]}"></button>`).join('')}</div></div>
      <div class="field"><label for="font-sel"><span style="font-size:.85rem;font-weight:600">Fuente</span></label><select class="input" id="font-sel">${FONTS.map((f, i) => `<option value="${i}" ${S.font === i ? 'selected' : ''}>${f[0]}${f[2] ? ' · ' + f[2] : ''}</option>`).join('')}</select></div>
      <div class="field"><label for="size-range"><span style="font-size:.85rem;font-weight:600">Tamaño del texto</span></label><div class="range"><input type="range" id="size-range" min="87.5" max="150" step="12.5" value="${S.size}"><output id="size-out">${String(S.size).replace('.', ',')} %</output></div>
        <div class="preview">Al final somos ocho para el sábado. ¿Te encargas tú del vino? Il1 O0 rn m</div></div>
      <div class="field"><span>Densidad</span>${seg('density', [['comoda', 'Cómoda'], ['compacta', 'Compacta']], S.density)}<small>Compacta reduce márgenes, nunca el tamaño del texto.</small></div>
      <div class="field"><span>Idioma</span>${seg('lang', [['es', 'Español'], ['en', 'English']], 'es')}<small>En el prototipo solo está el español; la app tendrá español e inglés.</small></div>
    </div></div></div>`;
}

function openCompose(reply) {
  const m = reply ? MSGS.find(x => x.id === S.sel) : null;
  const acc = m ? m.acc : (S.view === 'cuenta' ? S.acc : 'p');
  $('layer').innerHTML = `<div class="overlay" data-close="1"><form class="sheet" id="compose-form" role="dialog" aria-modal="true" aria-labelledby="cp-title">
    <div class="sheet-head"><h2 id="cp-title">${m ? 'Responder' : 'Nuevo correo'}</h2><button type="button" class="btn ghost small" data-act="close" aria-label="Cerrar">${I.x}</button></div>
    <div class="sheet-body" style="gap:.75rem">
      <label class="field"><span>Desde</span><select class="input" id="cp-from">${Object.entries(ACC).map(([k, a]) => `<option value="${k}" ${k === acc ? 'selected' : ''}>${a.name} · ${a.addr}</option>`).join('')}</select></label>
      <label class="field"><span>Para</span><input class="input" id="cp-to" value="${m ? m.email : ''}" placeholder="nombre@ejemplo.es"></label>
      <label class="field"><span>Asunto</span><input class="input" id="cp-subj" value="${m ? 'Re: ' + m.subject : ''}"></label>
      <label class="field"><span>Mensaje</span><textarea class="input" id="cp-body" placeholder="Escribe aquí…">${m ? '\n\n— El ' + m.day.toLowerCase() + ', ' + m.from + ' escribió:\n> ' + m.body[1 < m.body.length ? 1 : 0] : ''}</textarea></label>
    </div>
    <div class="sheet-foot"><button type="button" class="btn ghost" data-act="close">Descartar</button><button type="button" class="btn" data-act="schedule">Programar</button><button type="submit" class="btn primary">Enviar</button></div>
  </form></div>`;
  setTimeout(() => (m ? $('cp-body') : $('cp-to')).focus(), 30);
}
const closeLayer = () => { $('layer').innerHTML = ''; };

document.addEventListener('click', e => {
  const app0 = $('app');
  if (app0.dataset.drawer === 'open' && !e.target.closest('.side') && !e.target.closest('[data-act="drawer"]')) { app0.dataset.drawer = ''; return; }
  const t = e.target.closest('button, .overlay');
  if (!t) return;
  if (t.classList.contains('overlay')) { if (e.target === t) closeLayer(); return; }
  const app = $('app');
  if (t.dataset.box) { S.box = t.dataset.box; S.sel = null; app.dataset.pane = 'list'; app.dataset.drawer = ''; save(); render(); return; }
  if (t.dataset.view) { S.view = 'unificada'; save(); render(); return; }
  if (t.dataset.acc) { S.view = 'cuenta'; S.acc = t.dataset.acc; save(); render(); return; }
  if (t.dataset.open) { const m = MSGS.find(x => x.id === +t.dataset.open); m.unread = false; S.sel = m.id; app.dataset.pane = 'reader'; renderSide(); renderList(); renderReader(); renderTabbar(); $('reader').scrollTop = 0; return; }
  if (t.dataset.screen) {
    const m = MSGS.find(x => x.id === +t.dataset.screen), to = t.dataset.to;
    if (to === 'no') { MSGS.splice(MSGS.indexOf(m), 1); toast(`${m.from} bloqueado. No verás más sus correos.`); }
    else { m.box = to; m.seen = false; toast(`${m.from} aprobado. Sus correos irán a ${{ principal: 'Principal', novedades: 'Novedades', recibos: 'Recibos' }[to]}.`); }
    render(); return;
  }
  if (t.dataset.set) {
    const k = t.dataset.set, v = t.dataset.val;
    if (k === 'lang') { if (v === 'en') toast('El inglés llegará en la app final.'); return; }
    if (k === 'accent') S.accent = +v; else S[k] = v;
    if (k === 'mode') { S.box = v === 'enfoque' ? 'principal' : 'entrada'; S.sel = null; }
    if (k === 'view' && v === 'cuenta' && !S.acc) S.acc = 'p';
    save(); render(); openSettings(); return;
  }
  const act = t.dataset.act;
  if (!act) return;
  const m = MSGS.find(x => x.id === S.sel);
  if (act === 'compose') { app.dataset.drawer = ''; openCompose(false); }
  else if (act === 'reply') openCompose(true);
  else if (act === 'settings') { app.dataset.drawer = ''; openSettings(); }
  else if (act === 'close') closeLayer();
  else if (act === 'drawer') app.dataset.drawer = app.dataset.drawer === 'open' ? '' : 'open';
  else if (act === 'back') { app.dataset.pane = 'list'; S.sel = null; renderList(); renderReader(); }
  else if (act === 'later' && m) { m.later = !m.later; toast(m.later ? 'Añadido a Responder luego.' : 'Quitado de Responder luego.'); render(); }
  else if (act === 'aside' && m) { m.aside = !m.aside; toast(m.aside ? 'Apartado.' : 'Quitado de Apartados.'); render(); }
  else if (act === 'bubble' && m) toast('Volverá arriba el lunes a las 9:00.');
  else if (act === 'archive' && m) { m.box = 'archivo'; m.later = false; m.aside = false; S.sel = null; app.dataset.pane = 'list'; toast('Archivado.'); render(); }
  else if (act === 'schedule') toast('Se enviaría mañana a las 8:00 (prototipo).');
});

document.addEventListener('submit', e => { e.preventDefault(); closeLayer(); toast('Enviado. Es un prototipo: no ha salido ningún correo.'); });
document.addEventListener('input', e => {
  if (e.target.id === 'search') { S.q = e.target.value; const pos = e.target.selectionStart; renderList(); const s = $('search'); s.focus(); s.setSelectionRange(pos, pos); }
  else if (e.target.dataset.note) S.notes[e.target.dataset.note] = e.target.value, save();
  else if (e.target.id === 'size-range') { S.size = +e.target.value; $('size-out').textContent = String(S.size).replace('.', ',') + ' %'; applyLook(); save(); }
});
document.addEventListener('change', e => { if (e.target.id === 'font-sel') { S.font = +e.target.value; applyLook(); save(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('layer').innerHTML) closeLayer(); else $('app').dataset.drawer = ''; return; }
  if (/input|textarea|select/i.test(document.activeElement.tagName)) return;
  if (e.key === 'c') { e.preventDefault(); openCompose(false); }
  if (e.key === '/') { e.preventDefault(); $('search').focus(); }
});

if (!BOXES[S.mode].some(b => b[0] === S.box)) S.box = BOXES[S.mode][0][0];
if (window.matchMedia('(min-width: 641px)').matches) S.sel = 2;
render();
</script>
