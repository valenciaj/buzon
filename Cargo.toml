[workspace]
resolver = "2"
members = ["crates/store", "crates/sync", "crates/api", "crates/buzon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
ammonia = "4"
anyhow = "1"
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
argon2 = "0.5"
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
bs58 = "0.5"
chacha20poly1305 = "0.10"
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
mail-parser = "0.11"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = { version = "0.1", features = ["sync"] }
toml = "0.8"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }
uuid = { version = "1", features = ["v7"] }
webpki-roots = "0.26"
http-body-util = "0.1"
tempfile = "3"

buzon-store = { path = "crates/store" }
buzon-sync = { path = "crates/sync" }
buzon-api = { path = "crates/api" }
